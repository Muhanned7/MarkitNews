# FinnWinn on Render: Blueprint for frontend + backend + Postgres.
# Create it in the Render Dashboard: New -> Blueprint -> pick this repo.
# Region is Singapore (closest Render region to India). Region can't be changed later.

databases:
  - name: finnwinn-db
    plan: 0.1c-256mb            # smallest paid Postgres (~$6/mo); "free" expires
    region: singapore
    postgresMajorVersion: "17"
    databaseName: finnwinn
    user: finnwinn

services:
  # ---------- FastAPI backend: private service, not reachable from the internet ----------
  - type: pserv
    name: finnwinn-api
    runtime: python
    plan: 0.5c-512mb            # ~$7/mo, always on
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/init_db.py   # creates/updates tables before each deploy
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: finnwinn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: MOCK_MODE
        value: "false"
      - key: ALLOW_SANDBOX_BILLING   # "false" = no free Pro upgrades until Stripe is set up
        value: "false"
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  # ---------- Next.js frontend: the public website ----------
  - type: web
    name: finnwinn-web
    runtime: node
    plan: 0.5c-512mb            # ~$7/mo, always on
    region: singapore
    buildCommand: npm ci && npm run build
    # Render gives the backend's internal "host:port"; the app expects a full URL.
    startCommand: BACKEND_URL="http://$BACKEND_HOSTPORT" npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_HOSTPORT
        fromService:
          name: finnwinn-api
          type: pserv
          property: hostport
      - key: INTERNAL_SERVICE_KEY
        fromService:
          name: finnwinn-api
          type: pserv
          envVarKey: INTERNAL_SERVICE_KEY
      - key: PINECONE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FINNHUB_API
        sync: false
