# Backend settings for Cloud Run.
# Copy to deploy/backend.env.yaml (git-ignored) and fill in. Never commit the filled-in file.

# Neon -> your project -> Connect -> choose "Pooled connection", copy the string.
DATABASE_URL: "postgresql://USER:PASSWORD@ep-xxxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require"

# Generate each with:  openssl rand -hex 32
JWT_SECRET: "CHANGE_ME"
INTERNAL_SERVICE_KEY: "CHANGE_ME"   # copied to the frontend automatically by the deploy script

MISTRAL_API_KEY: ""
GROQ_API_KEY: ""
NEWSAPI_KEY: ""
HUGGINGFACE_API_KEY: ""

MOCK_MODE: "false"
ALLOW_SANDBOX_BILLING: "false"   # no free Pro upgrades until Stripe is set up
EXPOSE_METRICS: "false"          # hide /metrics on the public URL

# Optional - add when ready:
# STRIPE_SECRET_KEY: ""
# FRONTEND_URL: "https://finnwinn-web-xxxx.a.run.app"
# LANGFUSE_PUBLIC_KEY: ""
# LANGFUSE_SECRET_KEY: ""
# LANGFUSE_BASE_URL: ""
